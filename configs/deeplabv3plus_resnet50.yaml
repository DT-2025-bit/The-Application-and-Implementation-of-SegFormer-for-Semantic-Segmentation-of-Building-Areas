model_name: deeplabv3plus_resnet50
encoder: resnet50
num_classes: 2
pretrained: true

train_image_dir: data/processed/massachusetts/train/images
train_mask_dir: data/processed/massachusetts/train/masks
val_image_dir: data/processed/massachusetts/val/images
val_mask_dir: data/processed/massachusetts/val/masks
img_size: 512

# 6GB 下 ResNet50 建议 batch=2；若 OOM 改用 configs 中 mobilenet 思路或降为 1
batch_size: 2
num_workers: 4
epochs: 80
lr: 1.0e-4
weight_decay: 0.0001
warmup_epochs: 3
amp: true

ce_weight: 1.0
dice_weight: 1.0
edge_weight: 0.0
edge_kernel: 3

seed: 42
save_dir: outputs/deeplabv3plus_resnet50
log_interval: 20
val_interval: 1
early_stop_patience: 15
